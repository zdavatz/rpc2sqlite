[package]
name = "rpc2sqlite"
version = "0.1.0"
edition = "2021"
description = "Download the Swiss Produkteregister Chemikalien (RPC) and store it in SQLite"
license = "GPL-3.0-or-later"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json", "cookies"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"

[profile.release]
opt-level = 3
